name: Hourly scan

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (:07 and :37 UTC = :37 and :07 IST)
  workflow_dispatch:       # lets you run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run scanner (public data, no key)
        run: python scanner_web.py
      - name: Check if browsers may call Mudrex directly (CORS)
        run: |
          now=$(date +%s); st=$((now-7200))
          curl -s -D - -o /dev/null -H "Origin: https://siddiquema.github.io" \
            "https://trade.mudrex.com/fapi/v1/price/kline?assets=BTC/USDT&aggregation=1h&start_time=$st&end_time=$now" \
            | tr -d '\r' > site/cors.txt || true
          curl -s -D - -o /dev/null -X OPTIONS -H "Origin: https://siddiquema.github.io" \
            -H "Access-Control-Request-Method: GET" \
            "https://trade.mudrex.com/fapi/v1/price/kline" | tr -d '\r' >> site/cors.txt || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
